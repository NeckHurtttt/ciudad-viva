name: Focos de calor diarios
on:
  schedule:
    - cron: "17 11 * * *"   # 07:17 en Bolivia
  workflow_dispatch:
permissions:
  contents: write
jobs:
  focos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Bajar focos VIIRS de NASA FIRMS (últimos 7 días)
        run: python scripts/preparar.py --solo focos
      - name: Guardar si cambió
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add datos/focos.json
          git diff --cached --quiet || git commit -m "Focos de calor del $(date -u +%F)" && git push
